<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eShop | Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f9f9f9;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #444;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: url('https://via.placeholder.com/1200x400?text=Welcome+to+eShop') no-repeat center center/cover;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      text-shadow: 1px 1px 5px black;
    }

    .section-title {
      text-align: center;
      margin: 40px 0 20px;
      font-size: 2em;
      color: #333;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 0 40px 40px;
    }

    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .product-card img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }

    .product-card h3 {
      margin: 15px 0 5px;
    }

    .price {
      color: green;
      font-weight: bold;
    }

    .buy-btn {
      background-color: #28a745;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
    }

    .buy-btn:hover {
      background-color: #218838;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>eShop</h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
  </nav>

  <!-- Home Section -->
  <section id="home" class="hero">
    <div>Welcome to eShop – Your Online Store</div>
  </section>

  <!-- Products Section -->
  <section id="products">
    <h2 class="section-title">Our Products</h2>
    <div class="products">
      <div class="product-card">
       
        <h3>Mobile</h3>
        <p class="price">$29.99</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="product-card">
       
        <h3>Watch</h3>
        <p class="price">$19.99</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="product-card">
       
        <h3>Car</h3>
        <p class="price">$49.99</p>
        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 eShop. All rights reserved.
  </footer>

</body>
</html>
